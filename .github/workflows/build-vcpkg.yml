name: Build with vcpkg

on:
  push:
    branches:
      - master
      - v*

    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json

  pull_request:
    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json

jobs:
  build-vcpkg:
    name: ${{ matrix.os }}-${{ matrix.buildtype }}-luajit=${{ matrix.luajit }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
        buildtype: [Debug, Release]
        luajit: [on, off]

    env:
      VCPKG_BUILD_TYPE: release

    steps:
      - uses: actions/checkout@v4

      - run: echo CXX=g++-14 >> $GITHUB_ENV
        if: ${{ matrix.os == 'macos' || matrix.os == 'ubuntu' }}

      - name: Get latest CMake
        # Using 'latest' branch, the latest CMake is installed.
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      # Configure before CodeQL starts tracing. The vcpkg toolchain builds the
      # dependencies from source during project(), and everything compiled inside
      # the tracing window ends up in the CodeQL database.
      # The unity build is disabled on the CodeQL leg so that alerts are reported
      # against src/*.cpp instead of the generated Unity/unity_*.cxx files.
      - name: Configure with CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: vcpkg
          configurePresetAdditionalArgs: "['-DUSE_LUAJIT=${{ matrix.luajit }}', '-DENABLE_UNITY_BUILD=${{ (matrix.os == 'ubuntu' && matrix.buildtype == 'Debug') && 'OFF' || 'ON' }}']"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          queries: +security-extended,security-and-quality
        if: ${{ matrix.os == 'ubuntu' && matrix.buildtype == 'Debug' }}

      - name: Build with CMake
        uses: lukka/run-cmake@v10
        with:
          buildPreset: vcpkg
          buildPresetAdditionalArgs: "['--config', '${{ matrix.buildtype }}']"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          output: sarif-results
          upload: failure-only
        if: ${{ matrix.os == 'ubuntu' && matrix.buildtype == 'Debug' }}

      # paths-ignore has no effect on a compiled language that is analysed with a
      # build, so the dependency headers under build/vcpkg_installed and the
      # generated files under build/src have to be dropped from the results.
      - name: Filter out dependency and generated code
        uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            +**
            -build/**
            -vcpkg/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif
        if: ${{ matrix.os == 'ubuntu' && matrix.buildtype == 'Debug' }}

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:cpp"
        if: ${{ matrix.os == 'ubuntu' && matrix.buildtype == 'Debug' }}

      - name: Upload artifact binary
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(matrix.os, 'windows') }}
        with:
          name: tfs-${{ matrix.os }}-${{ matrix.buildtype }}-luajit=${{ matrix.luajit }}-${{ github.sha }}
          path: ${{ runner.workspace }}/build/${{ matrix.buildtype }}/tfs

      - name: Upload artifact binary (exe)
        uses: actions/upload-artifact@v4
        if: ${{ startsWith(matrix.os, 'windows') }}
        with:
          name: tfs-${{ matrix.os }}-${{ matrix.buildtype }}-luajit=${{ matrix.luajit }}-${{ github.sha }}
          path: |
            ${{ runner.workspace }}/build/${{ matrix.buildtype }}/tfs.exe
            ${{ runner.workspace }}/build/${{ matrix.buildtype }}/*.dll

      - name: Prepare datapack contents
        run: find . -maxdepth 1 ! -name data ! -name config.lua.dist ! -name key.pem ! -name LICENSE ! -name README.md ! -name schema.sql -exec rm -r {} \;
        shell: bash

      - name: Upload datapack contents
        uses: actions/upload-artifact@v4
        with:
          name: tfs-${{ matrix.os }}-${{ matrix.buildtype }}-luajit=${{ matrix.luajit }}-${{ github.sha }}
          path: ${{ github.workspace }}
