name: Build on Ubuntu

on:
  push:
    branches:
      - master
      - v*

    paths:
      - cmake/**
      - src/**
      - CMakeLists.txt

  pull_request:
    paths:
      - cmake/**
      - src/**
      - CMakeLists.txt

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y git cmake build-essential libluajit-5.1-dev libmysqlclient-dev
          libboost-dev libasio-dev
          libpugixml-dev libcrypto++-dev

      # Replaces ashutoshvarma/action-cmake-build, which is unmaintained and
      # still runs on a retired Node runtime. It only shelled out to cmake, so
      # calling cmake directly is equivalent; the build directory is kept where
      # the action put it so the artifact path is unchanged.
      - name: Configure with cmake
        env:
          CC: gcc
          CXX: g++
        run: cmake -B ${{ runner.workspace }}/build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_LUAJIT=on

      - name: Build with cmake
        run: cmake --build ${{ runner.workspace }}/build --parallel 2

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-tfs-amd64-${{ github.sha }}
          path: ${{ runner.workspace }}/build/tfs
