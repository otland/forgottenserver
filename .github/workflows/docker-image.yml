name: Docker

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
      - master

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  pull_request:
    branches:
      - master

env:
  IMAGE_NAME: forgottenserver

jobs:
  # Push image to the GitHub Container Registry.
  # The old Docker registry at docker.pkg.github.com has been shut down, so
  # images go to ghcr.io and are published with the maintained docker actions
  # instead of a hand-rolled docker login/tag/push.
  docker-image:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        if: github.ref_type == 'tag'
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:latest
