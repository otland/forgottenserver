name: Release builds with vcpkg

on:
  push:
    tags:
      - v*

jobs:
  release-vcpkg:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu, macos, windows]
        include:
          - name: ubuntu
            os: ubuntu-24.04
            triplet: x64-linux
            archive: tar
            extension: tar.gz
          - name: macos
            os: macos-latest
            triplet: arm64-osx
            archive: tar
            extension: tar.gz
          - name: windows
            os: windows-2022
            triplet: x64-windows
            archive: zip
            extension: zip

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BUILD_TYPE: release

    steps:
      - uses: actions/checkout@v7

      - name: Get latest CMake
        # Using 'latest' branch, the latest CMake is installed.
        uses: lukka/get-cmake@latest

      - name: Ubuntu - install luajit, remove libmysqlclient-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev
          sudo apt-get remove -y libmysqlclient-dev
        if: matrix.name == 'ubuntu'

      - name: macOS - install luajit pkgconfig
        run: brew install luajit pkgconfig
        if: matrix.name == 'macos'

      - name: Windows - remove C:/mysql*
        run: rm -r -fo C:/mysql*
        if: matrix.name == 'windows'

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true

      # run-cmake@v10 only drives CMakePresets.json, which this branch does not
      # have, so cmake is invoked directly. The build directory stays outside
      # the workspace because the datapack step below deletes the workspace
      # contents before collecting the binary.
      # run-vcpkg exports VCPKG_ROOT. On Windows it contains backslashes, which
      # an unquoted bash word would strip, so normalise them to forward slashes.
      - name: Configure with cmake
        run: >
          cmake -B ../build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT//\\//}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DUSE_LUAJIT=on
        shell: bash

      - name: Build with cmake
        run: cmake --build ../build --config Release --parallel 2
        shell: bash

      - name: Prepare datapack contents
        run: |
          find . -maxdepth 1 ! -name data ! -name config.lua.dist ! -name key.pem ! -name LICENSE ! -name README.md ! -name schema.sql -exec rm -r {} \;
          # Single-config generators emit ../build/tfs, multi-config ones emit
          # ../build/Release/tfs.exe, so look one level deep either way.
          find ../build -maxdepth 2 -type f \( -name tfs -o -name tfs.exe -o -name '*.dll' \) -exec cp {} . \;
          [ -f tfs ] || [ -f tfs.exe ] || { echo "::error::no tfs binary was produced"; exit 1; }
        shell: bash

      - name: Zip the release files
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: ${{ matrix.archive }}
          filename: tfs-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.extension }}
          path: forgottenserver
          directory: ../

      - name: Upload release artifact
        uses: ncipollo/release-action@v1
        with:
          artifacts: ../tfs-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.extension }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
